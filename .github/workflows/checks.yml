name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Visual checks
        if: ${{ !cancelled() }}
        run: pnpm test:visual
      - name: Test and visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            artifacts/visual-qa/
            docs/workbench/
          retention-days: 14
          if-no-files-found: warn
